[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomis"
version = "0.1.0"
description = "Auditable, budget-constrained churn experimentation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
cpu = ["catboost>=1.2.7,<2", "lightgbm>=4.5,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
autonomis = "autonomis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
